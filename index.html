<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa de Pan - Enlaces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Palette derived from casadepanorlando.com */
            --bg-dark: #0d0d0d;
            --card-bg: #1a1a1a;
            --copper-primary: #b87355;
            --copper-light: #d49a7a;
            --copper-gradient: linear-gradient(135deg, #c58364 0%, #8c4f35 100%);
            --text-white: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 16px;
        }

        /* Mobile Container Layout */
        .app-container {
            width: 100%;
            max-width: 480px; /* Perfect sizing for smartphone viewports */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header / Logo Styling */
        header {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(184, 115, 85, 0.2));
        }

        .slogan {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--copper-light);
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Main Menu Grid / Button Layout */
        .nav-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Base button design */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-white);
            font-weight: 600;
            font-size: 16px;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Active / Tap state simulation for phones */
        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Full width button specifics */
        .btn-full {
            width: 100%;
            height: 60px;
            background: var(--card-bg);
            padding: 0 24px;
            justify-content: flex-start;
            position: relative;
        }

        .btn-full i {
            font-size: 20px;
            margin-right: 16px;
            color: var(--copper-primary);
            width: 24px;
            text-align: center;
        }

        /* Right arrow for full rows */
        .btn-full::after {
            content: '\f105';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
        }

        /* Highlighted Premium Button (Ofrendas) */
        .btn-highlight {
            background: var(--copper-gradient);
            border: none;
        }
        
        .btn-highlight i {
            color: var(--text-white);
        }

        .btn-highlight::after {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Side-by-side Square Container */
        .square-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }

        .btn-square {
            aspect-ratio: 1 / 1; /* Forces true mathematical square layout */
            background-color: var(--card-bg);
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            text-align: center;
            font-size: 15px;
        }

        .btn-square i {
            font-size: 28px;
            color: var(--copper-primary);
        }

        /* Social Media Specific Accents */
        .btn-youtube i { color: #ff0000; }
        .btn-facebook i { color: #1877f2; }
        .btn-instagram i { color: #e1306c; }

        /* Footer */
        footer {
            margin-top: 40px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <img src="CDPLogo.png" alt="Casa de Pan Logo" class="logo">
            <div class="slogan">Donde Jesús lo es todo</div>
        </header>

        <main class="nav-menu">
            
            <a href="https://pushpay.com/g/iglesiacasadepanorlando" target="_blank" class="btn btn-full btn-highlight">
                <i class="fa-solid fa-heart-sign"></i>
                <span>Ofrendas</span>
            </a>

            <div class="square-row">
                <a href="#" class="btn btn-square">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Visitas</span>
                </a>
                
                <a href="#" class="btn btn-square">
                    <i class="fa-solid fa-cross"></i>
                    <span>Acepta a Cristo</span>
                </a>
            </div>

            <a href="#" class="btn btn-full">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>CDP App</span>
            </a>

            <a href="https://www.youtube.com/@casadepanorlando" target="_blank" class="btn btn-full btn-youtube">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <a href="https://www.facebook.com/casadepanorlando" target="_blank" class="btn btn-full btn-facebook">
                <i class="fa-brands fa-facebook-f"></i>
                <span>Facebook</span>
            </a>

            <a href="https://www.instagram.com/casadepanorlando" target="_blank" class="btn btn-full btn-instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>

        </main>

        <footer>
            &copy; 2026 Casa de Pan Orlando
        </footer>

    </div>

</body>
</html>
